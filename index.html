<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Scorecard</title>
<link rel="stylesheet" href="style.css?v=1793300000">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-box">
    <img class="login-logo" src="img/techsource.png" alt="Tech Source">
    <div class="login-top"><b>QA Scorecard</b><button type="button" id="loginLang" class="ghost" data-i18n="lang_switch"></button></div>
    <h2 data-i18n="li_title"></h2>
    <div id="li1">
      <p class="hint" data-i18n="li_hint"></p>
      <label><span data-i18n="li_email"></span><input id="liEmail" type="email" dir="ltr" autocomplete="email" placeholder="name@company.com"></label>
      <button class="primary" id="liSend" type="button" data-i18n="li_send"></button>
    </div>
    <div id="li2" hidden>
      <p class="hint"><span data-i18n="li_sent"></span> <b id="liTo" dir="ltr"></b></p>
      <label><span data-i18n="li_code"></span><input id="liCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" placeholder="123456"></label>
      <button class="primary" id="liVerify" type="button" data-i18n="li_verify"></button>
      <p class="hint" data-i18n="li_junk"></p>
      <button class="ghost" id="liResend" type="button"></button>
      <button class="ghost" id="liBack" type="button" data-i18n="li_back"></button>
    </div>
    <div class="msg" id="liMsg"></div>
    <button class="linkish" id="liAdmin" type="button" data-i18n="li_admin"></button>
  </div>
</div>
<header class="top">
  <div class="brand"><span class="logos"><img src="img/techsource.png" alt="Tech Source"><img src="img/tresjolie.png" alt="Tres Jolie" class="acct"></span>QA Scorecard <span class="ver" id="ver"></span></div>
  <nav>
    <button data-view="evaluate" class="active" data-i18n="nav_evaluate"></button>
    <button data-view="mywork" data-i18n="nav_mywork"></button>
    <button data-view="records" data-i18n="nav_records"></button>
    <button data-view="calibration" data-i18n="nav_calibration"></button>
    <button data-view="dashboard" data-i18n="nav_dashboard"></button>
    <button data-view="reports" data-i18n="nav_reports"></button>
    <button data-view="certification" data-i18n="nav_cert"></button>
    <button data-view="kb" data-i18n="nav_kb"></button>
    <button data-view="guide" data-i18n="nav_guide"></button>
    <button data-view="settings" data-i18n="nav_settings"></button>
    <button id="btnLang" class="lang" data-i18n="lang_switch"></button>
  </nav>
</header>

<main>
  <div id="printHead" class="print-head"></div>
  <!-- Evaluate -->
  <section id="view-evaluate" class="view active">
    <div id="connBanner" class="banner" hidden></div>
    <div id="editBanner" class="banner edit" hidden></div>
    <div class="layout">
      <div class="main-col">
        <div class="card">
          <div class="form-switch" id="formSwitch"></div>
          <div class="grid" id="headerFields"></div>
          <div id="dupWarn" class="dup-warn" hidden></div>
        </div>
        <div class="card">
          <h2 data-i18n="partA"></h2>
          <p class="hint" data-i18n="partA_hint"></p>
          <label class="check"><input type="checkbox" id="showExplain"> <span data-i18n="show_explain"></span></label>
          <button type="button" class="fill-rest" id="fillNc" data-i18n="fill_met"></button>
          <div id="ncList"></div>
        </div>
        <div class="card crit">
          <h2 data-i18n="partB"></h2>
          <p class="hint" data-i18n="partB_hint"></p>
          <button type="button" class="fill-rest" id="fillCrit" data-i18n="fill_noerr"></button>
          <div id="critList"></div>
        </div>
        <div class="card">
          <h2 data-i18n="feedback"></h2>
          <p class="hint" data-i18n="feedback_hint"></p>
          <div class="grid one">
            <label><span data-i18n="fb_strengths"></span><textarea id="fb_strengths" rows="4"></textarea></label>
            <label><span data-i18n="fb_improve"></span><textarea id="fb_improve" rows="4"></textarea></label>
            <label><span data-i18n="fb_coaching"></span><textarea id="fb_coaching" rows="4"></textarea></label>
          </div>
          <button id="btnRegen" type="button" data-i18n="regen"></button>
          <button id="btnCopyFb" type="button" data-i18n="copy_fb"></button>
          <span class="msg" id="fbMsg"></span>
        </div>
      </div>
      <aside class="side-col">
        <div class="card sticky" id="scorePanel">
          <h2 data-i18n="score"></h2>
          <div class="big" id="sFinal">–</div>
          <div class="result" id="sResult"></div>
          <dl class="kv">
            <dt data-i18n="nc_score"></dt><dd id="sNC">–</dd>
            <dt data-i18n="cc_acc"></dt><dd id="sCC">–</dd>
            <dt data-i18n="eu_acc"></dt><dd id="sEU">–</dd>
            <dt data-i18n="bc_acc"></dt><dd id="sBC">–</dd>
            <dt data-i18n="crit_errors"></dt><dd id="sCrit">0</dd>
            <dt data-i18n="unanswered"></dt><dd id="sOpen">–</dd>
          </dl>
          <button class="primary" id="btnSave" data-i18n="save_eval"></button>
          <button id="btnCsv" data-i18n="download_csv"></button>
          <button class="ghost" id="btnReset" data-i18n="clear_form"></button>
          <div class="msg" id="saveMsg"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- Calibration -->
  <section id="view-calibration" class="view">
    <div class="card">
      <h2 data-i18n="cal_title"></h2>
      <p class="hint" data-i18n="cal_hint"></p>
      <div class="toolbar" data-loader></div>
      <div class="grid">
        <label><span data-i18n="cal_sample"></span><select id="calSample"></select></label>
        <label><span data-i18n="cal_ref_pick"></span><select id="calRef"></select></label>
        <label><span data-i18n="cal_session"></span><input id="calSession" type="datetime-local"></label>
        <label><span data-i18n="cal_session_kind"></span><select id="calSessionKind"><option value="one" data-i18n="cal_kind_one"></option><option value="group" data-i18n="cal_kind_group"></option></select></label>
        <label><span data-i18n="cal_agreed"></span><input id="calAgreed" type="number" min="0" max="100" data-i18n-ph="cal_agreed_ph"></label>
      </div>
    </div>
    <div class="card" id="calOut"></div>
  </section>

  <!-- Dashboard -->
  <section id="view-mywork" class="view">
    <div class="card">
      <h2 id="mwTitle" data-i18n="mw_title"></h2>
      <p class="hint" data-i18n="mw_hint"></p>
      <div class="grid">
        <label id="mwWhoBox"><span data-i18n="evaluator"></span><select id="mwWho"></select></label>
        <label><span data-i18n="mw_period"></span><select id="mwPeriod">
          <option value="month" data-i18n="mw_this_month"></option><option value="lastmonth" data-i18n="mw_last_month"></option>
          <option value="week" data-i18n="mw_this_week"></option><option value="all" data-i18n="mw_all_time"></option></select></label>
      </div>
    </div>
    <div class="card" id="mwKpis"></div>
    <div class="card" id="mwCoverage"></div>
    <div class="card" id="mwTypes"></div>
    <div class="card" id="mwTeam"></div>
    <div class="card" id="mwRecent"></div>
  </section>

  <section id="view-dashboard" class="view">
    <div class="card">
      <h2 data-i18n="db_title"></h2>
      <div class="toolbar" data-loader></div>
      <div class="grid">
        <label><span data-i18n="f_form"></span><select id="dbForm"></select></label>
        <label><span data-i18n="f_agent"></span><select id="dbAgent"></select></label>
        <label><span data-i18n="f_evaluator"></span><select id="dbEvaluator"></select></label>
        <label><span data-i18n="f_type"></span><select id="dbType"></select></label>
        <label><span data-i18n="f_from"></span><input type="date" id="dbFrom"></label>
        <label><span data-i18n="f_to"></span><input type="date" id="dbTo"></label>
        <label><span data-i18n="f_level"></span><select id="dbCal"><option value="agent" data-i18n="lv_agent"></option><option value="program" data-i18n="lv_program"></option><option value="all" data-i18n="lv_all"></option></select></label>
      </div>
    </div>
    <div class="card" id="dbKpis"></div>
    <div class="dash-grid">
      <div class="card" id="dbItems"></div>
      <div class="card" id="dbCrit"></div>
      <div class="card" id="dbAgentsChart"></div>
      <div class="card" id="dbSections"></div>
      <div class="card" id="dbTrend"></div>
      <div class="card" id="dbEvaluators"></div>
    </div>
    <div class="card" id="dbAgents"></div>
  </section>

  <!-- Reports -->
  <section id="view-reports" class="view">
    <div class="card">
      <h2 data-i18n="rp_title"></h2>
      <p class="hint" data-i18n="rp_hint"></p>
      <div class="toolbar" data-loader></div>
      <div class="grid">
        <label><span data-i18n="rp_period"></span><select id="rpPreset"><option value="week" data-i18n="rp_p_week"></option><option value="lastweek" data-i18n="rp_p_lastweek"></option><option value="month" data-i18n="rp_p_month"></option><option value="lastmonth" data-i18n="rp_p_lastmonth"></option><option value="all" data-i18n="rp_p_all"></option><option value="custom" data-i18n="rp_p_custom"></option></select></label>
        <label><span data-i18n="f_from"></span><input type="date" id="rpFrom"></label>
        <label><span data-i18n="f_to"></span><input type="date" id="rpTo"></label>
        <label><span data-i18n="f_form"></span><select id="rpForm"></select></label>
        <label><span data-i18n="f_agent"></span><select id="rpAgent"></select></label>
        <label><span data-i18n="f_evaluator"></span><select id="rpEvaluator"></select></label>
        <label><span data-i18n="f_type"></span><select id="rpType"></select></label>
        <label><span data-i18n="f_level"></span><select id="rpLevel"><option value="agent" data-i18n="lv_agent"></option><option value="program" data-i18n="lv_program"></option><option value="all" data-i18n="rp_lv_all"></option></select></label>
        <label><span data-i18n="rp_method"></span><select id="rpMethod"><option value="" data-i18n="rp_all_methods"></option><option value="recording" data-i18n="m_recording"></option><option value="sidebyside" data-i18n="rp_m_sbs"></option></select></label>
      </div>
      <h3 data-i18n="rp_sections"></h3>
      <div class="rp-secs" id="rpSecs"></div>
    </div>
    <div id="rpOut"></div>
  </section>

  <!-- Certification -->
  <section id="view-certification" class="view">
    <div class="card">
      <h2 data-i18n="cert_title"></h2>
      <p class="hint" data-i18n="cert_hint"></p>
      <div class="toolbar" data-loader></div>
      <div class="grid">
        <label><span data-i18n="f_form"></span><select id="ctForm"></select></label>
        <label><span data-i18n="f_from"></span><input type="date" id="ctFrom"></label>
        <label><span data-i18n="f_to"></span><input type="date" id="ctTo"></label>
      </div>
      <details class="cert-rules">
        <summary data-i18n="cert_rules"></summary>
        <p class="hint" data-i18n="cert_rules_hint"></p>
        <div class="grid" id="ctSettings"></div>
        <button id="ctReset" data-i18n="cert_reset"></button>
        <ul class="rules">
          <li data-i18n="cert_r1"></li>
          <li data-i18n="cert_r2"></li>
          <li data-i18n="cert_r3"></li>
          <li data-i18n="cert_r4"></li>
          <li data-i18n="cert_r5"></li>
        </ul>
      </details>
    </div>
    <div class="card" id="ctOut"></div>
  </section>

  <!-- Saved evaluations -->
  <section id="view-records" class="view">
    <div class="card">
      <h2 data-i18n="rec_title"></h2>
      <p class="hint" data-i18n="rec_hint"></p>
      <div class="toolbar" data-loader></div>
      <div class="grid">
        <label><span data-i18n="f_search"></span><input id="recSearch" type="search" data-i18n-ph="rec_search_ph"></label>
        <label><span data-i18n="f_evaluator"></span><select id="recEvaluator"></select></label>
        <label><span data-i18n="f_agent"></span><select id="recAgent"></select></label>
        <label><span data-i18n="c_purpose"></span><select id="recPurpose">
          <option value="" data-i18n="f_all"></option><option value="live" data-i18n="p_live"></option><option value="certcall" data-i18n="p_certcall"></option><option value="program" data-i18n="p_program"></option><option value="coaching" data-i18n="p_coaching"></option>
          <option value="calibration" data-i18n="p_calibration"></option><option value="roleplay" data-i18n="p_roleplay"></option>
          <option value="test" data-i18n="test_tag"></option></select></label>
        <label><span data-i18n="h_callTag"></span><select id="recTag">
          <option value="" data-i18n="f_all"></option><option value="wow" data-i18n="tag_wow"></option><option value="good" data-i18n="tag_good"></option><option value="bad" data-i18n="tag_bad"></option></select></label>
        <label><span data-i18n="h_method"></span><select id="recMethod">
          <option value="" data-i18n="f_all"></option><option value="recording" data-i18n="m_recording"></option><option value="sidebyside" data-i18n="m_sidebyside"></option></select></label>
        <label><span data-i18n="h_selection"></span><select id="recSel">
          <option value="" data-i18n="f_all"></option><option value="random" data-i18n="sel_random"></option><option value="targeted" data-i18n="sel_targeted"></option></select></label>
      </div>
    </div>
    <div class="card" id="recOut"></div>
  </section>

  <!-- KB / offers updates log -->
  <section id="view-kb" class="view">
    <div class="card">
      <h2 data-i18n="kb_title"></h2>
      <p class="hint" data-i18n="kb_hint"></p>
      <div class="grid">
        <label><span data-i18n="kb_effective"></span><input id="kbWhen" type="datetime-local"></label>
        <label><span data-i18n="kb_cat"></span><select id="kbCat">
          <option value="offers" data-i18n="kbc_offers"></option><option value="services" data-i18n="kbc_services"></option>
          <option value="branches" data-i18n="kbc_branches"></option><option value="process" data-i18n="kbc_process"></option>
          <option value="other" data-i18n="kbc_other"></option></select></label>
        <label><span data-i18n="kb_by"></span><select id="kbBy"></select></label>
      </div>
      <div class="grid one"><label><span data-i18n="kb_text"></span><textarea id="kbText" rows="3" data-i18n-ph="kb_text_ph"></textarea></label></div>
      <button class="primary" id="kbAdd" data-i18n="kb_add"></button>
      <span class="msg" id="kbMsg"></span>
    </div>
    <div class="card" id="kbOut"></div>
  </section>

  <!-- Item guide -->
  <section id="view-guide" class="view">
    <div class="card">
      <h2 data-i18n="guide_title"></h2>
      <p class="hint" data-i18n="guide_hint"></p>
      <ol class="rules">
        <li data-i18n="rule1"></li>
        <li data-i18n="rule2"></li>
        <li data-i18n="rule3"></li>
        <li data-i18n="rule4"></li>
      </ol>
      <div class="toolbar">
        <label><span data-i18n="f_form"></span><select id="guideForm"></select></label>
        <button id="btnPrintGuide" data-i18n="print"></button>
      </div>
    </div>
    <div class="card" id="guideOut"></div>
  </section>

  <!-- Settings -->
  <section id="view-settings" class="view">
    <div class="card">
      <h2 data-i18n="conn"></h2>
      <div class="msg" id="connStatus"></div>
      <div class="account" id="account" hidden><span id="accountWho"></span> <button type="button" class="ghost" id="btnSignOut" data-i18n="li_signout"></button></div>
      <p class="hint" data-i18n="conn_hint"></p>
      <div class="grid one">
        <label><span data-i18n="set_url"></span><input id="setUrl" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec"></label>
        <label><span data-i18n="set_key"></span><input id="setKey" type="password" dir="ltr"></label>
      </div>
      <button class="primary" id="btnSaveSettings" data-i18n="save"></button>
      <button id="btnTest" data-i18n="test"></button>
      <button id="btnSetupLink" data-i18n="setup_link"></button>
      <div class="msg" id="setMsg"></div>
    </div>
    <div class="card">
      <h2 data-i18n="mail_head"></h2>
      <p class="hint" data-i18n="mail_hint"></p>
      <label><span data-i18n="mail_mode"></span><select id="setMail">
        <option value="auto" data-i18n="mail_auto"></option>
        <option value="outlook" data-i18n="mail_outlook"></option>
        <option value="outlookweb" data-i18n="mail_outlookweb"></option></select></label>
    </div>
    <div class="card" id="ownerCard">
      <h2 data-i18n="own_head"></h2>
      <p class="hint" data-i18n="own_hint"></p>
      <label><span data-i18n="own_target"></span><input id="setTarget" type="number" min="0" max="100" step="1" dir="ltr"></label>
      <div class="grid">
        <label><span data-i18n="own_pick_from"></span><input id="setPickFrom" type="time" dir="ltr"></label>
        <label><span data-i18n="own_pick_to"></span><input id="setPickTo" type="time" dir="ltr"></label>
        <label><span data-i18n="own_pick_days"></span><input id="setPickDays" type="number" min="1" max="31" step="1" dir="ltr"></label>
      </div>
      <button class="primary" id="btnSaveTarget" data-i18n="save"></button>
      <div class="msg" id="ownMsg"></div>
    </div>
    <div class="card">
      <h2 data-i18n="names"></h2>
      <p class="hint" id="namesHint"></p>
      <div id="rosterList" class="roster"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
<div id="miniBar" class="mini-bar" hidden>
  <span><span data-i18n="final"></span>: <b id="mbFinal">–</b></span>
  <span><span data-i18n="unanswered"></span>: <b id="mbOpen">–</b></span>
  <button class="primary" type="button" id="mbSave" data-i18n="save_eval"></button>
</div>

<template id="loaderTpl">
  <button class="loadSheet" data-i18n="load_sheet"></button>
  <label class="filebtn"><span data-i18n="import_files"></span><input type="file" class="loadFiles" accept=".json" multiple hidden></label>
  <span class="loadInfo"></span>
</template>

<script src="config.js?v=1793300000"></script>
<script src="i18n.js?v=1793300000"></script>
<script src="forms.js?v=1793300000"></script>
<script src="app.js?v=1793300000"></script>
</body>
</html>
